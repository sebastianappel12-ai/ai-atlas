name: Weekly re-check and dataset refresh

# Mondays: re-check older deals still marked "announced", refresh Epoch data centers,
# and (first Monday of the month) refresh EIA power plants and prices.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_CONTACT: ${{ vars.SEC_CONTACT || 'sebastianappel12@gmail.com' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Re-check announced deals
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/recheck.ts
      - name: Epoch data centers
        run: npx tsx scripts/import-epoch.ts
      - name: EIA plants, prices, SEC revenue (monthly)
        run: |
          if [ "$(date -u +%d)" -le 7 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx tsx scripts/import-eia-plants.ts
            npx tsx scripts/import-eia-prices.ts
            npx tsx scripts/import-sec.ts
          fi
      - run: npm run check-data -- --against origin/main
      - name: Commit
        run: |
          git config user.name "ai-atlas-agent"
          git config user.email "ai-atlas-agent@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Weekly re-check $(date -u +%F)"
            git push
          fi
