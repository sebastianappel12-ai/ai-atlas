name: Daily grid refresh

# Every morning: refresh the Energy Map grid colors from EIA-930 (free, no API key).
# Finding new deals is done by the scheduled Claude agent (docs/DAILY_AGENT.md), not here.
on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_CONTACT: ${{ vars.SEC_CONTACT || 'sebastianappel12@gmail.com' }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Grid fuel mix (EIA-930)
        run: npx tsx scripts/import-eia-grid.ts

      - name: Check data
        run: npm run check-data -- --against origin/main

      - name: Commit grid colors
        run: |
          git config user.name "ai-atlas-agent"
          git config user.email "ai-atlas-agent@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Grid colors $(date -u +%F)"
            git push
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Daily grid refresh failed $(date -u +%F)" --body "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --label agent-failure || true
